# The whole stack: Keycloak (+ its database), the API and the web app.
#   docker compose up -d --build     then open http://localhost:3000
include:
  - keycloak-config/docker-compose.yml

services:
  # The API's own database. PostgreSQL, the same engine as Amazon RDS for PostgreSQL, which it becomes on AWS.
  api-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: playground
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: playground
    volumes:
      - api-db:/var/lib/postgresql/data
      - ./apps/api/db/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    ports:
      - "5433:5432"   # for running the API or its tests outside Docker. Keycloak's own database stays private.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playground"]
      interval: 5s
      retries: 10

  # The web server's sessions and login attempts. Redis, the engine of Amazon ElastiCache, which it becomes on AWS.
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # for running the web integration tests outside Docker
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # One-off: brings the schema to head, then stops. The API never changes structure (ADR 0012). Run by hand with
  #   docker compose run --rm api-migrate
  # On AWS this is a one-off ECS task with the owner secret.
  api-migrate:
    build: ./apps/api
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      api-db:
        condition: service_healthy
    environment:
      # The owner role runs the migrations and creates the API role (migration 0002). Only this service gets the
      # owner's URL: the API refuses to start if it sees MIGRATION_DATABASE_URL.
      MIGRATION_DATABASE_URL: postgresql+psycopg://playground:playground@api-db:5432/playground
      API_DB_PASSWORD: playground-api-dev   # DEVELOPMENT ONLY. On AWS both passwords come from Secrets Manager.

  api:
    build: ./apps/api
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      api-db:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://localhost:8080            # the address in tokens (iss)
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080    # where this container reaches Keycloak
      # The API role, not the owner: it cannot change structure or the audit trail (ADR 0011). Development password.
      DATABASE_URL: postgresql+psycopg://playground_api:playground-api-dev@api-db:5432/playground
      BOOTSTRAP_ADMIN_EMAILS: admin@example.test
    ports:
      - "8000:8000"

  web:
    build: ./apps/web
    depends_on:
      api:
        condition: service_started
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      APP_URL: http://localhost:3000
      API_URL: http://api:8000
      KEYCLOAK_ISSUER: http://localhost:8080/realms/playground
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/playground
      KEYCLOAK_CLIENT_ID: playground-web
      KEYCLOAK_CLIENT_SECRET: playground-web-dev-secret
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"

volumes:
  api-db:
