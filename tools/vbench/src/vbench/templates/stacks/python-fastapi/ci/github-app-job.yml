
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Lint (Ruff)
        run: uv run ruff check .
      - name: Format (Ruff)
        run: uv run ruff format --check .
      - name: Types (mypy)
        run: uv run mypy .
      - name: Boundaries (ports and adapters)
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest --cov
      - name: Static security (Bandit)
        run: uv run bandit -r src -q
      - name: Dependency audit (informational)
        run: uv run pip-audit
        continue-on-error: true
