# The optional dashboard. The CLI does not need it: `vbench check`, `status`, `next` and the skills work without it.
#
#   PROJECT=/path/to/your/project docker compose up --build      # then open http://localhost:3100
#   PROJECT=$PWD/../.. VBENCH_FORMAT=playground docker compose up --build   # the auth app, in its own format
#
# PROJECT defaults to the current folder, mounted read-only: the dashboard only reads.
# Everything is published on 127.0.0.1 only. Diagrams are drawn by the PlantUML renderer, which has no published port.

name: vbench-ui
services:
  dashboard:
    build: .
    image: vbench:dashboard
    command: ["serve", "--host", "0.0.0.0", "--port", "3100"]
    ports: ["127.0.0.1:3100:3100"]
    volumes: ["${PROJECT:-.}:/project:ro"]
    environment:
      VBENCH_PLANTUML_URL: http://plantuml:8080
      VBENCH_FORMAT: ${VBENCH_FORMAT:-vbench}   # playground = the auth app's own format (needs a vbench.json)
    depends_on: [plantuml]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  plantuml:
    image: plantuml/plantuml-server:jetty
    expose: ["8080"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
