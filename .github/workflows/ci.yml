# The same checks as `scripts/check.sh full`, split into jobs so a failure says which part broke. Each job calls one mode of
# that script (ADR 0014), so what runs here and what runs on a laptop cannot drift apart.
# Branch protection (a required human review and these jobs as required checks) is set in the GitHub settings, not here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (SQLite and PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: playground
          POSTGRES_PASSWORD: playground
          POSTGRES_DB: playground_test      # always a *_test database: the tests drop every table
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U playground" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Format, lint and tests on SQLite
        run: ../../scripts/check.sh api
      - name: Tests on PostgreSQL
        env:
          # The API role: migration 0002 creates it, with the password in this URL. The app and the tests connect as it.
          TEST_DATABASE_URL: postgresql+psycopg://playground_api:playground-api-dev@localhost:5432/playground_test
          # The owner role (the service's POSTGRES_USER) runs Alembic and drops the tables between tests (ADR 0012).
          TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://playground:playground@localhost:5432/playground_test
        run: uv run pytest -q

  web:
    name: Web tests, lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Format, lint, types and unit tests
        run: ../../scripts/check.sh web
      - run: npm run build

  traceability:
    name: Requirements and test tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # One report from the same checks, kept as an artifact and shown on the run page. The checks themselves
      # fail the job (validate, tag report); the use case and V cycle readings are informational for now.
      - name: Build the traceability report
        run: |
          mkdir -p report
          set +e
          python3 .claude/skills/vbench-req/scripts/req_tool.py validate > report/req-validate.txt 2>&1; echo $? > report/req-validate.exit
          python3 .claude/skills/vbench-at/scripts/at_tool.py report > report/tag-report.txt 2>&1; echo $? > report/tag-report.exit
          python3 .claude/skills/vbench-uc/scripts/uc_tool.py validate > report/uc-validate.txt 2>&1
          python3 .claude/skills/vbench-vcycle/scripts/vcycle.py --all > report/vcycle.txt 2>&1
          python3 .claude/skills/vbench-vcycle/scripts/vcycle.py --all --json > report/vcycle.json 2>/dev/null
          python3 .claude/skills/vbench-req/scripts/req_tool.py duplicates > report/duplicates.txt 2>&1
          {
            echo "# Traceability report"
            echo
            echo "Commit \`${GITHUB_SHA}\`, branch \`${GITHUB_REF_NAME}\`, run ${GITHUB_RUN_ID}."
            echo
            echo "## Requirements and criteria (req_tool validate, exit $(cat report/req-validate.exit))"
            echo '```'; tail -15 report/req-validate.txt; echo '```'
            echo "## Test tags (at_tool report, exit $(cat report/tag-report.exit))"
            echo '```'; tail -40 report/tag-report.txt; echo '```'
            echo "## The V cycle of every use case (informational)"
            echo '```'; cat report/vcycle.txt; echo '```'
            echo "## Use case check (informational)"
            echo '```'; tail -8 report/uc-validate.txt; echo '```'
            echo "## Likely duplicates (a prompt for a person)"
            echo '```'; head -60 report/duplicates.txt; echo '```'
            echo
            echo "The report shows that tagged tests exist. That they pass is shown by the other jobs of this run; that a person has reviewed the links is shown by the stamps."
          } > report/report.md
          cat report/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the traceability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traceability-report
          path: report/
          if-no-files-found: ignore
          retention-days: 90
      - name: Tests of the tools, requirements are well formed, tags name real criteria (fails the job)
        run: scripts/check.sh trace

  stack:
    name: Fresh stack, integration and acceptance tests
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install the test runners
        run: |
          (cd apps/api && uv sync --frozen)
          (cd apps/web && npm ci)
      - name: Build and start the stack, run the tests, wipe it
        run: scripts/test-stack.sh run
